
version: 2

sources:
  - name: alpenstorm_gold
    # Configure via environment variables (no environment-specific names in the repo)
    catalog: "{{ env_var('DBT_SOURCE_CATALOG') }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA') }}"
    description: "Gold analytical dataset for Alpenstrom, a Swiss energy provider."

    tables:
      - name: gold_dim_customer
      - name: gold_dim_date
      - name: gold_dim_energy_tariff
      - name: gold_fact_energy_consumption